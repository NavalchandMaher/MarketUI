name: market_app

description: AI Powered Trading Dashboard

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5

  http: ^1.3.0

  google_fonts: ^6.3.0

  intl: ^0.20.2

  fl_chart: ^1.0.0

  flutter_animate: ^4.5.2

  shimmer: ^3.0.0

  shared_preferences: ^2.5.3

  cached_network_image: ^3.4.1

  lottie: ^3.3.1

  flutter_secure_storage: ^9.0.0

  jwt_decoder: ^2.0.1

  # Phase 1: Modernization dependencies
  get_it: ^7.6.0
  hive_flutter: ^1.1.0
  dio: ^5.3.0
  connectivity_plus: ^5.0.0
  equatable: ^2.0.5
  uuid: ^4.5.3

dev_dependencies:
  hive_generator: ^2.0.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
